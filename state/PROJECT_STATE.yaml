current_focus: "Ngày 28/11/2026, main 820ffb1: ADR-0019 tới ADR-0025 đã gộp. Dự án giúp Owner phân tích một mã cổ phiếu và giữ kỷ luật đầu tư; Owner quyết định và tự đặt lệnh (ADR-0019). Hồ sơ mã do ghế phân tích làm theo docs/QUY_TRINH_HO_SO_MA.md và phải có phiếu máy ĐẠT (ADR-0020); hồ sơ, tệp gốc và sổ số liệu nằm ngoài kho. Ba hồ sơ mã đã giao (FPT bản 2, HPG bản 2, GAS bản 1 sửa 1), mỗi hồ sơ có phiếu máy ĐẠT với sha256 ghi ở Project; chưa có lần hậu kiểm nào. Vòng dự báo đầu của ADR-0024 đã khóa năm câu trên hai cụm. ADR-0026 (ACCEPTED 28/11/2026, có hiệu lực khi Owner gộp PR của ADR này): cổng bằng chứng chỉ mở khi đủ cả năm điều ở ADR-0026 QĐ-B1 điểm 3, tính trên ba hồ sơ đã giao tới ngày 28/11/2026, bắt đầu từ lần hậu kiểm theo báo cáo quý IV/2026; tới ngày cổng mở không thêm năng lực mới, không mở phép thử tay mới, không bắt đầu gói Pha 2, chỉ làm các việc trong danh sách đóng ở QĐ-B1 điểm 2; ngừng phép so theo độ phủ và số đo theo nhãn lập luận của ADR-0024; phép so A với B của ADR-0024 chạy như đã khóa; sổ kết quả hậu kiểm ở Project là thước chẩn đoán vận hành của phần phân tích. L-02 áp cho mọi đầu ra: Mục 8 (định giá theo khoảng) chỉ viết sau khi Owner sửa L-02 (QĐ-P13). Vẫn ngừng theo QĐ-P11: máy dò tín hiệu và lượt thử hằng tuần (research.trials_per_cycle = 0), FWD-001 và sổ bóng, phần phán quyết của SCN-001, thang vốn 0–6, media, học viện A so với B. Thư viện SOURCED 1/40. deployment_level 0; không có mô hình ACTIVE; vốn thật vẫn khóa."
