    - "PR ADR-0020, vòng sửa 1 theo bản chấm L-09 (năm lỗi chặn; gói giao số 7): kiem_luat khóa mục 8 bằng câu cố định và chặn khoảng giá ở mọi mục; kiem_trich_dan giữ dấu khi đối chiếu, chỉ cho dòng gốc của sổ đúng nguồn và trang hợp thức hóa số ĐÃ KIỂM, báo trang không có thật, siết ngoại lệ (cột nguon, trang; chỉ cho số ĐÃ KIỂM; tỷ lệ và cảnh báo trên phiếu), số không nhãn luôn là CHƯA GẮN NHÃN; nhan_tep ghi trang_sha256.csv và kiem_ke bắt trang bị sửa, thêm, mất. QĐ-H7 viết lại thành cổng kỹ thuật, thước đo QĐ-P14 giữ nguyên. Test đối kháng cho từng lỗi trong tests/test_hoso.py."
    - "PR ADR-0020, vòng sửa 2 theo bản chấm L-09 vòng 2 (hai lỗi chặn; gói giao số 9): Owner quyết bỏ hẳn ngoại lệ (con số máy không lần ra thì không mang nhãn ĐÃ KIỂM); dòng sửa trong sổ phải gần chuỗi máy đọc và có đẳng thức cộng trừ chứng minh; cổng giá cổ phiếu theo quy tắc cho phép (giá, hệ số định giá, vốn hóa chỉ nêu dưới dạng số quá khứ có nguồn trong đoạn ĐÃ KIỂM, không kèm từ chỉ tương lai). ADR-0020 sửa QĐ-H3, QĐ-H4 và điều kiện hoàn tác 1 theo đó."
