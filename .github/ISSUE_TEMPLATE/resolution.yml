name: Resolution
description: Phân định một câu hỏi dự báo đã tới hạn (ARCHITECTURE v3.0 §4.1 bước 4, ADR-0003). Workflow kiểm và ghi ledger/resolutions.jsonl.
title: "[Resolution] "
labels: ["resolution"]
body:
  - type: input
    id: forecast_ids
    attributes:
      label: forecast_ids
      description: Mã dự báo của MỘT câu hỏi (ví dụ "F-101, F-102"). Ghi một mã cũng được — mọi dự báo cùng câu hỏi nhận cùng kết quả.
    validations: {required: true}
  - type: dropdown
    id: outcome
    attributes:
      label: outcome
      description: YES = mệnh đề trong câu hỏi đúng; NO = sai; VOID = hủy câu hỏi, không chấm (nguồn không công bố, câu hỏi sai đề, dự báo thiếu dấu nhận) — phải có void_reason. Cả ba chỉ ghi được khi tới resolve_at (riêng YES được sớm nếu câu hỏi có luật event_before_date). Trong kiểm định A–B, cặp bị VOID tính theo hướng bất lợi cho kết luận đang xét
      options: ["YES", "NO", "VOID"]
    validations: {required: true}
  - type: input
    id: observed_value
    attributes:
      label: observed_value
      description: Giá trị quan sát được (nếu câu hỏi là số), ví dụ "2,61%"
  - type: input
    id: resolution_source
    attributes:
      label: resolution_source
      description: Đường dẫn ĐẦY ĐỦ bắt đầu bằng https:// tới trang đã đọc (http:// bị từ chối). Mọi đường dẫn ghi ở đây phải thuộc tên miền đã ghi trong dự báo (tên miền con được nhận). Nguồn đó không công bố thì chọn VOID
  - type: textarea
    id: quote
    attributes:
      label: quote
      description: Trích nguyên văn đoạn trong nguồn chứa con số hoặc sự kiện (bắt buộc với YES/NO)
  - type: input
    id: resolver
    attributes:
      label: resolver
      description: Ai đọc nguồn và phân định. Ghi BẮT ĐẦU bằng tên ghế — "Owner", hoặc mô hình khác nhà cung cấp với ghế viết dự báo, ví dụ "ChatGPT (OpenAI)". Đây là người ĐỌC NGUỒN và quyết định, không phải người bấm nút. Không được là Claude (L-09)
    validations: {required: true}
  - type: textarea
    id: void_reason
    attributes:
      label: void_reason
      description: Chỉ với VOID — vì sao hủy câu hỏi (bắt buộc)
