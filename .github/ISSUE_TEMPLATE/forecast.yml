name: Forecast
description: Ghi một dự báo vào Prediction Ledger (ARCHITECTURE v3.0 §4.1). Workflow sẽ kiểm, đóng dấu thời gian và ghi hash chuỗi.
title: "[Forecast] "
labels: ["forecast"]
body:
  - type: dropdown
    id: seat
    attributes:
      label: seat
      description: A = có thư viện; B = Claude trần (nhóm đối chứng)
      options: ["A", "B"]
    validations: {required: true}
  - type: textarea
    id: question
    attributes:
      label: question
      description: Câu hỏi có/không, có luật phân định rõ. Không phải khuyến nghị mua bán. Ghế A và ghế B dán CÙNG một câu chữ; mỗi ghế chỉ một dự báo cho một câu hỏi.
    validations: {required: true}
  - type: input
    id: resolution_source
    attributes:
      label: resolution_source
      description: Nguồn công khai dùng để phân định. BẮT BUỘC nêu tên miền (vd nso.gov.vn hoặc https://www.sbv.gov.vn) — lúc phân định máy chỉ nhận đường dẫn thuộc tên miền ghi ở đây.
    validations: {required: true}
  - type: dropdown
    id: resolution_rule
    attributes:
      label: resolution_rule
      options: ["numeric_range", "event_before_date", "comparison", "excess_return_positive"]
    validations: {required: true}
  - type: input
    id: resolve_at
    attributes:
      label: resolve_at
      description: Ngày phân định, YYYY-MM-DD, phải sau hôm nay. Đây là hạn chấm, không phải ngày thông tin được công bố.
    validations: {required: true}
  - type: input
    id: info_lock_at
    attributes:
      label: info_lock_at
      description: "Ngày đầu tiên thông tin phân định có thể công khai, YYYY-MM-DD. Phải trùng đúng info_lock_at của dòng lịch calendar_id; ngày tự khai khác lịch bị từ chối."
    validations: {required: true}
  - type: input
    id: calendar_id
    attributes:
      label: calendar_id
      description: "BẮT BUỘC. Id (CAL-…) một dòng governance/release_calendar.jsonl do robot ghim từ Issue [Calendar] mở TRƯỚC Issue này, do ghế khác người viết ghi. Thiếu hoặc sai thì robot không nhận dự báo."
    validations: {required: true}
  - type: input
    id: p
    attributes:
      label: p
      description: Xác suất mệnh đề đúng, từ 0.05 đến 0.95 (chỉ ghi con số, ví dụ 0.35)
    validations: {required: true}
  - type: input
    id: base_rate
    attributes:
      label: base_rate
      description: Xác suất nền, từ 0 đến 1 (chỉ ghi con số, ví dụ 0.5)
    validations: {required: true}
  - type: textarea
    id: invalidation_conditions
    attributes:
      label: invalidation_conditions
      description: Điều gì xảy ra thì luận điểm sai
    validations: {required: true}
  - type: input
    id: author_seat
    attributes:
      label: author_seat
      description: Ghế đã trả lời — BẮT ĐẦU bằng tên mô hình, ví dụ "Claude Project TTC" hoặc "Claude trần" (L-09)
    validations: {required: true}
  - type: input
    id: model_cutoff
    attributes:
      label: model_cutoff
      description: Tháng cắt dữ liệu của mô hình theo mô hình tự khai, dạng YYYY-MM, ví dụ 2026-06 (L-05)
    validations: {required: true}
  - type: textarea
    id: library_refs
    attributes:
      label: library_refs
      description: Chỉ với seat A — id KNOWLEDGE_NOTE/mệnh đề đã dùng
  - type: input
    id: prompt_hash
    attributes:
      label: prompt_hash
      description: BẮT BUỘC với seat B — sha256 của prompt chuẩn đang có hiệu lực (dòng cuối của governance/control_b_prompts.jsonl); seat A để trống
