name: Resolution intake (Resolution issue)

# Phan dinh du bao da toi han (ADR-0003). Cung khuon voi ledger_intake.yml:
# chi Issue luc MO, do chinh chu kho mo, tieu de "[Resolution]" hoac nhan "resolution"; moi run tu thu lai khi bi trung.
# Thu tu (ADR-0003 quyet dinh 10): mot Issue phan dinh chi ghi ket qua cho du bao mo TRUOC no; neu so dang co du bao cua cau
# hoi mo cung luc hoac sau Issue nay thi khong ghi gi (mo Issue Resolution moi). Truoc khi ghi, tools/resolution_intake.py
# tu chay lai toan bo luat kiem tren trang thai sau khi ghi va khong ghi khi da sat han dau nhan.
# Cung workflow nhan Issue "[Publication]" (ledger/publication_evidence.jsonl) va "[Calendar]" (governance/release_calendar.jsonl,
# ADR-0011): moc thoi gian cua lich la so Issue + gio tao Issue do GitHub cap va gio bot dang dau nhan, khong co truong tu khai.
# Than Issue va moi gia tri do nguoi dung nhap chi di qua bien moi truong, khong chen vao lenh.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: resolution-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      (contains(github.event.issue.labels.*.name, 'resolution') || startsWith(github.event.issue.title, '[Resolution]') || contains(github.event.issue.labels.*.name, 'publication') || startsWith(github.event.issue.title, '[Publication]') || contains(github.event.issue.labels.*.name, 'calendar') || startsWith(github.event.issue.title, '[Calendar]')) &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai jsonschema
        run: pip install "jsonschema>=4"
      - name: Nhan phan dinh va ghi vao Ledger (tu thu lai khi bi trung)
        id: intake
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          git config user.name "ttc-ledger"
          git config user.email "ttc-ledger@users.noreply.github.com"
          fail='{"ok":false,"message":"Loi he thong: khong ghi duoc vao main sau 8 lan thu"}'
          out="$fail"
          code=1
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main && git reset -q --hard origin/main
            out=$(python tools/resolution_intake.py)
            code=$?
            if [ "$code" != "0" ]; then break; fi
            if [ -f ledger/resolutions.jsonl ]; then git add ledger/resolutions.jsonl; fi
            if [ -f ledger/publication_evidence.jsonl ]; then git add ledger/publication_evidence.jsonl; fi
            if [ -f governance/release_calendar.jsonl ]; then git add governance/release_calendar.jsonl; fi
            msg="ledger: resolution #${ISSUE_NUMBER}"
            tmpf="${TMPDIR:-/tmp}/ttc-intake-$$-$i.json"
            printf '%s' "$out" > "$tmpf"
            kind=$(python -c 'import json,sys; print((json.load(open(sys.argv[1])) or {}).get("kind") or "")' "$tmpf")
            rm -f "$tmpf"
            if [ "$kind" = "publication" ]; then msg="ledger: publication #${ISSUE_NUMBER}"; fi
            if [ "$kind" = "calendar" ]; then msg="ledger: calendar #${ISSUE_NUMBER}"; fi
            git commit -q -m "$msg"
            if git push -q origin HEAD:main; then break; fi
            out="$fail"
            code=1
            sleep $(( (RANDOM % 15) + 5 ))
          done
          if [ -z "$out" ]; then out='{"ok":false,"message":"Loi he thong: script khong in ket qua (xem log)"}'; code=1; fi
          echo "result=$out" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$out"
          exit 0
      # Binh luan nay la DAU NHAN: github-actions[bot] dang hash cua dong vua ghi, gio dang do may chu GitHub ghi.
      # tools/ledger_audit.py doi chieu tung dong so voi dau nhan (dung Issue, bot dang, chua sua, trong 6 gio sau khi mo, truoc ngay resolve_at).
      # Chay lai job (ma 3 = da ghi): chi dang lai dau nhan neu lan truoc chua dang duoc.
      - name: Binh luan ket qua va dau nhan
        id: comment
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.intake.outputs.result }}
          CODE: ${{ steps.intake.outputs.code }}
        with:
          retries: 3
          script: |
            let r;
            try { r = JSON.parse(process.env.RESULT); } catch (e) { r = {ok: false, message: "Loi he thong: ket qua khong doc duoc (xem log)"}; }
            const where = {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number};
            const marks = (r.ok && Array.isArray(r.attest) ? r.attest : []).map(a => "ledger-attest: " + a);
            if (process.env.CODE === "3") {
              const old = await github.paginate(github.rest.issues.listComments, {...where, per_page: 100});
              const have = marks.length > 0 && old.some(c => c.user && c.user.login === "github-actions[bot]" &&
                c.created_at === c.updated_at && marks.every(m => (c.body || "").includes(m)));
              if (have || marks.length === 0) return;
            }
            // Thong bao co the nhac lai chu nguoi dung nhap: vo hieu moi chuoi "ledger-attest" trong do; dau nhan chi nam o cac dong duoi.
            let body = (r.ok ? "✅ " : "❌ ") + String(r.message || "").replace(/ledger-attest/gi, "ledger_attest");
            if (marks.length) body += "\n\nDấu nhận của sổ (máy kiểm toán đọc các dòng dưới đây — không sửa, không xóa bình luận này):\n" +
              marks.map(m => "`" + m + "`").join("\n");
            // Dong da nam tren main thi dau nhan PHAI duoc dang: thu lai toi 5 lan (cho 20, 40, 60, 80 giay) khi GitHub tam loi.
            // Van hong thi job do: chay lai job nay trong vong 6 gio ke tu luc Issue mo (ma 3 se dang bo sung dau nhan).
            for (let i = 1; ; i++) {
              try { await github.rest.issues.createComment({...where, body}); break; }
              catch (e) {
                if (i >= 5) throw e;
                core.warning("Dang binh luan loi (lan " + i + "): " + e.message);
                await new Promise(done => setTimeout(done, 20000 * i));
              }
            }
            if (process.env.CODE !== "3") {
              try { await github.rest.issues.addLabels({...where, labels: [r.ok ? "ledgered" : "rejected"]}); }
              catch (e) { core.warning("Khong gan duoc nhan (dau nhan da dang, so khong anh huong): " + e.message); }
            }
      - name: Loi he thong (ma 1) lam job do; tu choi (2) va trung (3) la ket qua hop le
        if: steps.intake.outputs.code == '1'
        env:
          RESULT: ${{ steps.intake.outputs.result }}
        run: |
          echo "Intake loi he thong hoac khong day duoc len main: $RESULT"
          exit 1
