name: Factory plus Finance P1 integration CI (read only)
on:
  push:
    branches: ["review/umlf-finance-factory-integration-p1-*", "review/umlf-auto07b-*", "review/umlf-auto08-*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  factory-synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact-sourced finance patch and protected Factory code
        run: python tools/validate_factory_review.py
      - name: Factory contracts and adversarial A-B-C integration tests
        run: python -m unittest discover -s tests -p 'test_factory_*.py' -v
  finance-and-factory-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared finance dependencies (no model provider APIs)
        run: python -m pip install -r requirements.txt pytest
      - name: Record Python and resolved dependency versions (audit evidence only)
        run: |
          python -VV
          python -m pip freeze --all
      - name: Finance law and Ledger tests
        run: python -m pytest -q tests/test_laws_validate.py
      - name: Finance lookahead regression
        run: python -m tests.test_no_lookahead
      - name: Finance architecture and laws validation
        run: python tools/validate.py
      - name: Full finance plus Factory regression (BLOCKING, no continue-on-error)
        run: python -m pytest -q tests
      - name: Fail if testing changed tracked or untracked finance artifacts
        if: always()
        run: |
          git diff --exit-code -- engine/ governance/ data/ ledger/ state/ paper/ reports/ research/ fact/ memory/ knowledge/ config.yaml
          changed="$(git status --porcelain --untracked-files=all -- engine/ governance/ data/ ledger/ state/ paper/ reports/ research/ fact/ memory/ knowledge/ config.yaml)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            exit 1
          fi
