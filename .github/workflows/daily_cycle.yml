name: Vong hoc hang tuan

# ARCHITECTURE v3.0 §4.3 + ADR-0003: engine la doi chung am, chay HANG TUAN (thu Sau 16:30 gio VN) de so lan thu
# khong phinh nguong Bonferroni; ingest tai bu moi phien tu ngay cuoi trong kho nen khong mat du lieu.
# L-06: TTC_REGISTRY_PUSH=1 -> moi lan thu duoc DAY len main (tools/registry_push.py) TRUOC khi chay backtest. Vong hoc hong
# giua chung thi dang ky cua lan thu do van nam tren main, lan sau khong dung lai ma thu va van dem no vao so lan thu.
on:
  schedule:
    - cron: "30 9 * * 5"
  workflow_dispatch:
    inputs:
      trials:
        description: "So thu nghiem nghien cuu"
        required: true
        default: "1"

permissions:
  contents: write
  issues: read          # scorecard doi chieu Issue lich/bang chung va dau nhan cua bot (ADR-0011, fail closed khi loi)

concurrency:
  group: daily-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Fail closed BEFORE checkout, installs, ingestion, registry writes, or API use.
      # Scheduled weekly research remains at 6 trials; manual recovery is limited to 1.
      - name: Xac nhan so lan thu truoc khi chay
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TRIALS: ${{ github.event.inputs.trials }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "effective_trials=6 (scheduled)"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_TRIALS" != "1" ]; then
              echo "::error::Manual dispatch chi duoc trials=1; nhan '$REQUESTED_TRIALS'. Can Owner duyet va PR policy rieng neu muon doi."
              exit 1
            fi
            echo "effective_trials=1 (manual)"
          else
            echo "::error::Unexpected event: $EVENT_NAME"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cai thu vien
        run: |
          pip install -r requirements.txt
          # Khong cai vnstock: PyPI dang cach ly (quarantined) vnstock va vnai. Nguon gia chinh: Yahoo (config data.sources)
      - name: Kiem tra chong nhin truoc tuong lai
        run: python -m tests.test_no_lookahead
      - name: Kiem tra cau truc bo nao
        # scorecard STALE (so da co dong moi tu robot) chi la CANH BAO o day: chan o buoc nay thi vong hoc khong bao gio
        # chay duoc de sinh scorecard moi. scorecard INVALID (diem nang luc khong co xuat xu GitHub) van chan.
        run: python tools/validate.py
      - name: Chay vong hoc (dang ky tung lan thu len main truoc khi chay)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTC_REGISTRY_PUSH: "1"
          TTC_PROVENANCE_ONLINE: "1"
          GITHUB_TOKEN: ${{ github.token }}
          TRIALS: ${{ github.event_name == 'schedule' && '6' || github.event.inputs.trials }}
        run: |
          case "$TRIALS" in ''|*[!0-9]*) echo "trials phai la so nguyen khong am: '$TRIALS'"; exit 1;; esac
          python -m engine.run_cycle --source live --trials "$TRIALS"
      - name: Kiem lai sau khi chay (ket qua trai luat thi khong ghi vao main)
        # Hau kiem nghiem: reports/scorecard.json vua sinh phai khop so dong + sha256 cua Ledger, Resolution, bang chung cong bo,
        # lich, va ngay gia moi nhat (kho cu + tep thang, ADR-0006). Lech la loi: khong ghi scorecard sai len main.
        run: python tools/validate.py --require-fresh-scorecard
      - name: Ghi ket qua vao bo nao
        run: |
          git config user.name "ttc-engine"
          git config user.email "ttc-engine@users.noreply.github.com"
          git add -A data state research knowledge paper reports fact ledger memory library/notes
          git diff --cached --quiet || git commit -m "Vong hoc $(date -u +%F)"
          # Robot có thể đã đẩy Ledger lên main trong lúc vòng học chạy. Sau rebase, scorecard của snapshot cũ là STALE.
          # Sinh lại từ sổ mới, hậu kiểm FRESH, rồi mới push. Tối đa 5 lần. Lệch sau khi làm mới thì dừng, không đẩy bản cũ.
          for i in 1 2 3 4 5; do
            if ! git pull -q --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              sleep $(( i * 10 ))
              continue
            fi
            python -m engine.run_cycle --scorecard-only --source store || exit 1
            python tools/validate.py --require-fresh-scorecard || exit 1
            git add reports/scorecard.json
            git diff --cached --quiet || git commit -m "scorecard: lam moi theo so sau khi dong bo main"
            git push && exit 0
            sleep $(( i * 10 ))
          done
          exit 1
