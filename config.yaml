# Cấu hình ML Engine — TRUNG TÂM TÀI CHÍNH v0.2
market: VN
data:
  source: vnstock          # vnstock | store | synthetic
  vnstock_source: VCI
  start: "2016-01-01"
  store: data/store/prices.csv.gz
universe: [ACB, BCM, BID, BVH, CTG, FPT, GAS, GVR, HDB, HPG, MBB, MSN, MWG, PLX, POW,
           SAB, SHB, SSB, SSI, STB, TCB, TPB, VCB, VHM, VIB, VIC, VJC, VNM, VPB, VRE]
horizon_days: 20           # dự báo lợi nhuận vượt trội 20 phiên
costs:                     # chi phí thực tế thị trường VN
  buy_fee: 0.0015
  sell_fee: 0.0015
  sell_tax: 0.001
  slippage: 0.001
  dividend_tax: 0.05       # thuế TNCN trên cổ tức tiền (paper trading)
lot_size: 100
corporate_actions:         # sự kiện quyền → hệ số điều chỉnh giá (dữ liệu dẫn xuất)
  manual: data/corporate_actions.csv            # nhập tay, có nguồn, ưu tiên hơn Yahoo
  yahoo_cache: data/derived/yahoo_actions.csv   # tải lại toàn bộ mỗi lần ingest
  derived: data/derived/adjustment_factors.csv  # tính lại toàn bộ mỗi lần, có computed_at
quality:                   # kiểm tra chất lượng: biến động vượt biên độ sàn mà không có sự kiện quyền = lỗi dữ liệu
  price_limit: 0.07        # biên độ HOSE
  tolerance: 0.003         # dung sai làm tròn bước giá
  limit_overrides:         # mã từng niêm yết sàn khác trong kỳ dữ liệu
    - {ticker: SHB, until: "2023-12-31", limit: 0.10, note: "SHB niêm yết HNX (±10%) trước khi chuyển HOSE; ngày chuyển cần đối chiếu CBTT — dữ liệu cho thấy |biến động| tới 9,4% năm 2022, ≤ 6,8% từ 2023"}
  window_sessions: 20      # cửa sổ tính tỷ lệ lỗi gần nhất
  max_error_rate: 0.01     # vượt ngưỡng → hôm đó KHÔNG nghiên cứu, KHÔNG dự báo
  feature_lookback: 121    # feature của một mã bị loại nếu có cờ lỗi trong ngần này phiên gần nhất
  flags_file: data/derived/quality_flags.csv
research:
  trials_per_cycle: 6
  min_train_days: 500
  test_days: 120
  top_k: 5
  min_t: 3.0               # ngưỡng t tối thiểu
  family_wise_alpha: 0.05  # ngưỡng tăng dần theo tổng số thử nghiệm (chống data mining)
  min_fold_positive: 0.6
registry:
  max_active: 5
  refit_days: 20
decay:
  min_realized_days: 40
  window_days: 120
paper:
  initial_cash: 1000000000
  top_k: 5
  rebalance_days: 20
llm_review:
  enabled: true
  model: claude-sonnet-5
# ---- v1.0 Giai đoạn 1 ----
ledger:
  horizons: [5, 20]
  min_p: 0.05
  max_p: 0.95
  min_n_for_verdict: 30
experts:
  model: claude-sonnet-5
  max_predictions_per_day: 6
  max_tokens: 1500
  price_input_per_mtok: 0     # Owner điền theo bảng giá API hiện hành (USD / 1 triệu token). 0 = chưa đặt → chuyên gia TẮT
  price_output_per_mtok: 0
news:
  max_items: 40
  feeds:
    - https://vnexpress.net/rss/kinh-doanh.rss
    - https://cafef.vn/thi-truong-chung-khoan.rss
    - https://vietstock.vn/830/chung-khoan/co-phieu.rss
