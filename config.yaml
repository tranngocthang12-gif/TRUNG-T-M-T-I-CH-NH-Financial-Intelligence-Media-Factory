# Cấu hình ML Engine — TRUNG TÂM TÀI CHÍNH v0.2
market: VN
data:
  source: live             # live (tải theo `sources`) | store | synthetic
  sources: [yahoo]         # thứ tự thử. vnstock BỊ GỠ: PyPI cách ly (quarantined) gói vnstock và vnai — xem governance/DATA_SOURCES.yaml
  vnstock_source: VCI      # chỉ dùng nếu Owner duyệt đưa vnstock trở lại `sources`
  start: "2016-01-01"
  store: data/store/prices.csv.gz        # kho cũ, ĐÓNG BĂNG từ ADR-0006 — không ghi lại
  store_dir: data/store/prices          # ADR-0006: dòng mới, mỗi tháng giao dịch một tệp CSV, chỉ nối thêm
  ingest_extra: [BSR, LPB, MCH, TCX, VPL] # E2b (QĐ-4): CHỈ TẢI GIÁ thêm các mã này (thành viên VN30 theo kỳ, ngoài `universe`)
                                          # cho chế độ universe="historical"; không vào bảng mặc định (universe="config")
universe_basis: CURRENT     # ADR-0008: danh sách dưới là VN30 HIỆN TẠI dùng cho toàn bộ lịch sử → báo cáo gắn nhãn thiên lệch sống sót
universe: [ACB, BCM, BID, BVH, CTG, FPT, GAS, GVR, HDB, HPG, MBB, MSN, MWG, PLX, POW,
           SAB, SHB, SSB, SSI, STB, TCB, TPB, VCB, VHM, VIB, VIC, VJC, VNM, VPB, VRE]
horizon_days: 20           # dự báo lợi nhuận vượt trội 20 phiên
costs:                     # chi phí thực tế thị trường VN
  buy_fee: 0.0015
  sell_fee: 0.0015
  sell_tax: 0.001
  slippage: 0.001
  dividend_tax: 0.05       # thuế TNCN trên cổ tức tiền (paper trading)
lot_size: 100
corporate_actions:         # sự kiện quyền → hệ số điều chỉnh giá (dữ liệu dẫn xuất)
  manual: data/corporate_actions.csv            # nhập tay, có nguồn, ưu tiên hơn Yahoo
  yahoo_cache: data/derived/yahoo_actions.csv   # tải lại toàn bộ mỗi lần ingest
  derived: data/derived/adjustment_factors.csv  # tính lại toàn bộ mỗi lần, có computed_at
quality:                   # kiểm tra chất lượng: biến động vượt biên độ sàn mà không có sự kiện quyền = lỗi dữ liệu
  price_limit: 0.07        # biên độ HOSE
  tolerance: 0.003         # dung sai làm tròn bước giá
  limit_overrides:         # mã từng niêm yết sàn khác trong kỳ dữ liệu
    - {ticker: SHB, until: "2023-12-31", limit: 0.10, note: "SHB niêm yết HNX (±10%) trước khi chuyển HOSE; ngày chuyển cần đối chiếu CBTT — dữ liệu cho thấy |biến động| tới 9,4% năm 2022, ≤ 6,8% từ 2023"}
  window_sessions: 20      # cửa sổ tính tỷ lệ lỗi gần nhất
  max_error_rate: 0.01     # vượt ngưỡng → hôm đó KHÔNG nghiên cứu, KHÔNG dự báo
  feature_lookback: 121    # feature của một mã bị loại nếu có cờ lỗi trong ngần này phiên gần nhất
  flags_file: data/derived/quality_flags.csv
research:
  trials_per_cycle: 6
  min_train_days: 500
  test_days: 120
  top_k: 5
  min_t: 3.0               # ngưỡng t tối thiểu
  family_wise_alpha: 0.05  # ngưỡng tăng dần theo tổng số thử nghiệm (chống data mining)
  min_fold_positive: 0.6
  # ARCHITECTURE v3.0 §4.3 + L-06: không gian giả thuyết ĐÓNG BĂNG (13 feature × 3 mô hình). Thêm feature/mô hình mới
  # = giả thuyết mới: phải qua ADR rồi mới sửa danh sách này; engine từ chối đăng ký lần thử nằm ngoài danh sách.
  frozen_space:
    features: [dist_ma120, dist_ma20, lowvol_20, lowvol_60, maxret_20, mom_120_skip20, mom_20, mom_60, rel_mom_20,
               rev_1, rev_5, volu_ratio, volu_trend]
    models: [ridge, gbm, signed_sum]
  # L-06 (ADR-0003, vòng chấm 7): GHIM 210 kết quả thử đầu tiên của research/trials.csv như chúng có tại v3.0.2.
  # tools/validate.py so sha256 của đúng 210 dòng đầu với giá trị này; sửa, xóa hay chèn một ô là đỏ. Các kết quả sau đó
  # được chốt bằng dòng neo ở đầu research/trial_registry.jsonl (engine ghi lúc tạo sổ). Không sửa ba dòng dưới đây.
  legacy_pin:
    results: 210
    last_trial_id: T00210
    sha256: 53b28e246c1bba842d93eac30478942422e00000da2519a93ece6c12498548af
  # L-06 (ADR-0004): MỐC v3.0.2 CỐ ĐỊNH = đầu nhánh main ngay trước khi gộp PR #28 (cha thứ nhất của commit gộp 0b0bffc).
  # tools/ledger_audit.py chỉ miễn kiểm "đăng ký trước kết quả" cho commit nằm trong lịch sử của commit này (vòng học bản
  # cũ); mọi commit khác — kể cả nhánh tách từ lịch sử cũ rồi gộp vào sau — đều bị kiểm. Không sửa dòng dưới đây.
  v302_boundary: c777f91392946ed613417c4e9ae494dfcbc9322f
registry:
  max_active: 5
  refit_days: 20
decay:
  min_realized_days: 40
  window_days: 120
paper:
  initial_cash: 1000000000
  top_k: 5
  rebalance_days: 20
  # R1a (QĐ-5, ADR-0016): cổng rủi ro trước khi mua của sổ giấy (engine/risk_gate.py). Tham số thí nghiệm DANH NGHĨA, không
  # phải khẩu vị rủi ro của Owner. Thiếu khóa hoặc còn TODO thì cổng FAIL, sổ không mở vị thế mới. Ngắt khi sụt giảm NAV là R1b.
  risk_limits:
    max_weight: 0.20            # tỷ trọng một mã tại lúc quyết định và lúc khớp lệnh mua
    max_participation: 0.10     # phần giá trị giao dịch bình quân được dùng mỗi phiên khi thoát vị thế
    max_exit_days: 3            # số phiên tối đa để thoát vị thế
    adv_sessions: 20            # số phiên tính giá trị giao dịch bình quân
    quarantine_sessions_before: 21   # QĐ-3: loại mã khi phiên t ∈ [k − 21, k + 120] phiên quanh phiên áp dụng k
    quarantine_sessions_after: 120   # của một sự kiện cổ phiếu đang bị cách ly; đếm phiên theo lịch HOSE
llm_review:
  enabled: true
  model: claude-sonnet-5
# ---- v1.0 Giai đoạn 1 ----
ledger:
  # ADR-0003 quyết định 11 (vòng chấm 8): đường ghi dự báo của engine (chuyên gia LLM tự ghi, engine tự chấm bằng giá) ĐÓNG.
  # Sổ dự báo chỉ nhận dòng từ Issue 'Forecast'/'Resolution' — có Issue thật và dấu nhận của robot. tools/validate.py chỉ
  # chấp nhận giá trị closed; mở lại phải qua ADR mới kèm cơ chế bằng chứng xuất xứ cho dòng engine, không phải sửa chữ này.
  engine_forecasts: closed
  horizons: [5, 20]
  min_p: 0.05
  max_p: 0.95
  min_n_for_verdict: 30
experts:
  model: claude-sonnet-5
  max_predictions_per_day: 6
  max_tokens: 1500
  price_input_per_mtok: 0     # Owner điền theo bảng giá API hiện hành (USD / 1 triệu token). 0 = chưa đặt → chuyên gia TẮT
  price_output_per_mtok: 0
news:
  max_items: 40
  feeds:
    - https://vnexpress.net/rss/kinh-doanh.rss
    - https://cafef.vn/thi-truong-chung-khoan.rss
    - https://vietstock.vn/830/chung-khoan/co-phieu.rss
