note: >
  27 câu ứng viên cho 54 dự báo A và B còn thiếu. Không có xác suất.
  Không câu nào hợp lệ với robot hôm nay: chưa có Issue Calendar do Owner mở,
  và chưa có ngày info_lock lấy từ lịch chính thức còn hiệu lực.
  F-37–F-42 giữ nguyên, không giải sớm, resolve_at 2026-12-20.
  Ghế B không được đọc hồ sơ ghế A. Danh sách này không phải hồ sơ của A hay B.
