questions:
  - id: Q-01
    calendar_id: CAL-NSO-CPI-2026-12
    agency: NSO
    domain: nso.gov.vn
    question: "Theo công bố đầu tiên trên nso.gov.vn, CPI cả nước tháng 12/2026 có tăng từ 3,50% trở lên so với tháng 12/2025 không?"
    yes_if: "Số công bố đầu tiên của tốc độ tăng CPI tháng 12/2026 so với cùng kỳ lớn hơn hoặc bằng 3,50%."
    no_if: "Số đó nhỏ hơn 3,50%."
    void_if: "Không có công bố đầu tiên trên nso.gov.vn, hoặc đổi năm gốc hay định nghĩa chỉ tiêu."
